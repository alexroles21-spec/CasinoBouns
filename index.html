<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bônus Exclusivo Aviator Brasil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: radial-gradient(circle at center, #1a0933 0%, #05020a 100%); color: #fff; text-align: center; padding: 20px 15px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 440px; width: 100%; background: rgba(23, 15, 38, 0.95); padding: 30px 20px; border-radius: 24px; border: 2px solid #ff0055; box-shadow: 0 0 35px rgba(255, 0, 85, 0.4), inset 0 0 15px rgba(255, 0, 85, 0.2); backdrop-filter: blur(10px); position: relative; overflow: hidden; }
        .badge { background: linear-gradient(90deg, #ff0055, #ff5500); color: #fff; padding: 8px 18px; border-radius: 50px; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; display: inline-block; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.5); }
        h1 { font-size: 26px; font-weight: 900; margin-bottom: 12px; line-height: 1.2; text-transform: uppercase; }
        h1 span { color: #00ff88; text-shadow: 0 0 12px rgba(0, 255, 136, 0.6); }
        p { color: #d1d5db; font-size: 15px; margin-bottom: 25px; line-height: 1.5; font-weight: 500; }
        .promo-box { background: rgba(0, 0, 0, 0.6); border: 2px dashed #00ff88; border-radius: 16px; padding: 16px; margin-bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .promo-title { font-size: 13px; color: #a1a1aa; text-transform: uppercase; font-weight: 700; }
        .code-row { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
        .promo-code { font-size: 24px; font-weight: 900; color: #00ff88; letter-spacing: 2px; }
        .copy-btn { background: #00ff88; color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .copy-btn:active { transform: scale(0.95); }
        .btn { display: block; background: linear-gradient(135deg, #00ff88 0%, #00b359 100%); color: #000; font-size: 20px; font-weight: 900; text-decoration: none; padding: 18px; border-radius: 16px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 25px rgba(0, 255, 136, 0.6); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 136, 0.5); } 50% { transform: scale(1.04); box-shadow: 0 0 35px rgba(0, 255, 136, 0.8); } 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 136, 0.5); } }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">🔥 BÔNUS EXCLUSIVO BRASIL 🔥</span>
        <h1>GANHE <span>500% DE BÔNUS</span> NO SEU 1º DEPÓSITO!</h1>
        <p>Aproveite agora! Multiplique suas chances de forrar no <strong>Aviator</strong> e jogue com banca alta hoje mesmo!</p>

        <div class="promo-box">
            <div class="promo-title">Copie seu código promocional:</div>
            <div class="code-row">
                <span class="promo-code" id="code">AviatorClub21</span>
                <button class="copy-btn" onclick="copyCode()">Copiar</button>
            </div>
        </div>

        <a href="https://one-vv3870.com/casino/list?open=register&p=1cw1" class="btn">RESGATAR BÔNUS AGORA</a>
    </div>

    <script>
        function copyCode() {
            const codeText = document.getElementById('code').innerText;
            navigator.clipboard.writeText(codeText);
            const btn = document.querySelector('.copy-btn');
            btn.innerText = 'Copiado!';
            btn.style.background = '#ff0055';
            btn.style.color = '#fff';
            setTimeout(() => {
                btn.innerText = 'Copiar';
                btn.style.background = '#00ff88';
                btn.style.color = '#000';
            }, 2000);
        }
    </script>
</body>
</html>
